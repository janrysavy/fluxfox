name: Native snapshot context

on:
  push:
    branches: [main, codex/snapshot-context]
  pull_request:
  workflow_dispatch:

jobs:
  context:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Test context graph and native library
        run: cargo test -p fluxfox --no-default-features --features core,archives,mfi,fat,flux,ibm_pc,serde --lib --locked
      - name: Test native library without serialization
        run: cargo test -p fluxfox --no-default-features --features core,archives,mfi,fat,flux,ibm_pc --lib --locked
